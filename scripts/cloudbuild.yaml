# CI for lind-wasm-example-grates
#
# Runs identically for pull requests targeting main and for pushes to main.
# The goal of this stage is a single thing: surface a pass/fail test signal
# on the PR. Image publishing is deliberately out of scope.
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: Build And Test
    entrypoint: bash
    env:
      # PR triggers set _HEAD_BRANCH; push triggers set BRANCH_NAME.
      - "HEAD_BRANCH=${_HEAD_BRANCH}"
      - "BRANCH_NAME=${BRANCH_NAME}"
      - "COMMIT_SHA=${COMMIT_SHA}"
    args:
      - -c
      - |
        set -euo pipefail

        branch="${HEAD_BRANCH:-${BRANCH_NAME:-unknown}}"
        commit="${COMMIT_SHA:-}"

        # Write outputs outside /workspace.
        out=/tmp/grates-out
        rm -rf "${out}"

        # --output type=local requires the docker-container driver.
        docker buildx create --use --name cbuilder --driver docker-container \
          || docker buildx use cbuilder
        docker buildx inspect --bootstrap

        echo "Testing branch=${branch} commit=${commit:-<none>}"

        # The Dockerfile's test stage catches make failures and records the outcome in e2e_status.
        if ! docker buildx build \
          --platform=linux/amd64 \
          --progress=plain \
          --pull \
          --target artifacts \
          --build-arg BRANCH_NAME="${branch}" \
          --build-arg COMMIT_SHA="${commit}" \
          --output type=local,dest="${out}" \
          .; then
          echo "Build failed before the test stage could run."
          exit 1
        fi

        if [[ ! -f "${out}/e2e_status" ]]; then
          echo "e2e_status was not produced. Check the artifacts stage."
          exit 1
        fi

        echo "===== test summary ====="
        cat "${out}/test-artifacts/test-summary.txt" || true
        echo "========================"
        
        # e2e_status is no longer the gate; it is kept for log readability
        # and for the parser sanity check below.
        status="$(tr -d '\r\n' < "${out}/e2e_status")"
        echo "e2e_status: ${status}"

        summary="${out}/test-artifacts/test-summary.txt"

        # Failures in this build, normalized by the shared extractor.
        # Empty output is a valid result (all tests passed), so do not let
        # grep's exit code abort the build here.
        scripts/extract-failures.sh "${summary}" > /tmp/actual.txt || true

        # Baseline, with comments and blank lines stripped. comm(1) requires
        # sorted input on both sides.
        grep -vE '^[[:space:]]*(#|$)' scripts/known-failures.txt \
          | sort -u > /tmp/known.txt

        # Parser sanity check: the summary reports its own failure count.
        # If that count disagrees with the number of FAIL lines we extracted,
        # the regex in extract-failures.sh has drifted from the output format
        # and every comparison below would be meaningless.
        reported="$(grep -oE '^[[:space:]]+Failed:[[:space:]]+[0-9]+' "${summary}" \
          | grep -oE '[0-9]+' || echo "")"
        extracted="$(wc -l < /tmp/actual.txt)"

        if [[ -z "${reported}" ]]; then
          echo "ERROR: could not read the 'Failed:' count from the test summary."
          echo "The summary format has changed; update scripts/extract-failures.sh."
          cat "${summary}" || true
          exit 1
        fi

        if [[ "${reported}" -ne "${extracted}" ]]; then
          echo "ERROR: summary reports ${reported} failure(s) but ${extracted} were parsed."
          echo "scripts/extract-failures.sh no longer matches the output format."
          cat "${summary}" || true
          exit 1
        fi

        new_failures="$(comm -23 /tmp/actual.txt /tmp/known.txt)"
        fixed="$(comm -13 /tmp/actual.txt /tmp/known.txt)"

        echo "===== known failures (allowed by baseline) ====="
        comm -12 /tmp/actual.txt /tmp/known.txt
        echo "==============================================="

        if [[ -n "${fixed}" ]]; then
          echo "NOTE: the following tests are no longer failing:"
          echo "${fixed}"
          echo "Please remove them from scripts/known-failures.txt."
        fi

        if [[ -n "${new_failures}" ]]; then
          echo "===== NEW FAILURES ====="
          echo "${new_failures}"
          echo "========================"
          echo "--- make-test.log (last 200 lines) ---"
          tail -n 200 "${out}/test-artifacts/make-test.plain.log" || true
          echo "These failures are not in the baseline and were introduced by this change."
          exit 1
        fi

        echo "No new failures."